# E2E backend suite — spins up a full local Supabase stack (Postgres +
# migrations + edge functions) and runs the API-level scenarios in e2e/.
name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies all migrations)
        run: supabase start

      - name: Serve edge functions
        run: |
          nohup supabase functions serve > /tmp/functions.log 2>&1 &
          sleep 8

      - name: Export local keys
        run: |
          echo "E2E_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$(supabase status -o env | grep -E '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep -E '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Install suite dependencies
        working-directory: e2e
        run: npm install

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Run E2E suite
        working-directory: e2e
        run: npm test

      - name: Upload report + function logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/reports/
            /tmp/functions.log
          if-no-files-found: ignore
